# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys PeopleGuard AI as a free Python web service. Starts in demo mode;
# add an API key in the Render dashboard to enable live AI.
services:
  - type: web
    name: peopleguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
